name: player
description: پلیر ویدیو با زیرنویس رمزگذاری‌شده
publish_to: 'none'
version: 1.1.0+7

environment:
  sdk: '>=3.10.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # موتور پخش ویدیو (بر پایه mpv) و پشتیبانی اندروید
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # انتخاب دستی زیرنویس
  file_picker: ^8.0.0

  # دسترسی به حافظه گوشی
  permission_handler: ^11.3.0

  # کار با مسیر فایل‌ها (پیدا کردن زیرنویس هم‌اسم)
  path: ^1.8.0

  # ذخیره ویدیوهای دیده‌شده و آخرین موقعیت پخش
  shared_preferences: ^2.2.0

  # کنترل نور صفحه با اشاره
  screen_brightness: ^2.1.11

  # روشن نگه داشتن صفحه هنگام پخش
  wakelock_plus: ^1.1.1

  # ── آیکون‌ها و انیمیشن UI ──
  # پک آیکون گرد/نرم — ۱۲۴۷ آیکون در هر استایل (BSD-3)
  solar_icons: ^0.1.0
  # پلیر Lottie — برای آیکون‌های متحرک و اسپلش (MIT)
  # برای پک آیکون SVG سفارشی، flutter_svg را هم اضافه کن
  lottie: ^3.5.1

  # کنترل صدای سیستم گوشی
  volume_controller: ^3.6.0
  url_launcher: ^6.2.5
  whisper_ggml_plus: ^1.1.0
  path_provider: ^2.1.2
  share_plus: ^11.0.0
  youtube_explode_dart: ^3.1.0
  flutter_go_torrent_streamer: ^0.0.8
  dio: ^5.4.0
  http: ^1.2.0
  google_mlkit_translation: ^0.11.0
  flutter_onnxruntime: ^1.8.5
  dart_sentencepiece_tokenizer: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
